  - id: q028
    batch: 2
    category: time_series
    difficulty: easy
    question: How much did revenue grow in 2025 compared with 2024?
    reference_sql: |
      SELECT sum(total_amount) FILTER (WHERE order_date < '2025-01-01') AS y2024,
             sum(total_amount) FILTER (WHERE order_date >= '2025-01-01') AS y2025,
             round(100 * (sum(total_amount) FILTER (WHERE order_date >= '2025-01-01')
                   / sum(total_amount) FILTER (WHERE order_date < '2025-01-01') - 1), 2) AS growth_pct
      FROM analytics.orders WHERE status = 'delivered'
    expected: {kind: values, values: {growth_pct: 26.98, y2024: 6213856.24, y2025: 7890259.85}, tolerance: 0.01}
    notes: Growth of 27.0%. Passing needs at least two of the three numbers.
    review: approved

  - id: q029
    batch: 2
    category: multi_step
    difficulty: medium
    question: Did the South region recover after its revenue drop in March 2025?
    reference_sql: |
      SELECT to_char(o.order_date, 'YYYY-MM') AS month, sum(o.total_amount) AS revenue
      FROM analytics.orders o JOIN analytics.regions r USING (region_id)
      WHERE r.region_name = 'South' AND o.status = 'delivered'
        AND o.order_date >= '2025-01-01' AND o.order_date < '2025-07-01'
      GROUP BY 1 ORDER BY 1
    expected: {kind: values, values: {2025-02: 154497.61, 2025-03: 26790.45, 2025-04: 185831.11}, tolerance: 0.02, unit: USD}
    must_mention: [[recover, back, rebound, bounced]]
    notes: Yes. April ($185,831) was above February ($154,498) and stayed there (May $181k, June $195k).
    review: approved

  - id: q030
    batch: 2
    category: multi_step
    difficulty: medium
    question: How much revenue did returned Footwear items represent in 2025?
    reference_sql: |
      SELECT round(sum(i.quantity * i.unit_price * (1 - i.discount_pct / 100)), 2) AS returned_value,
             count(*) AS returned_lines
      FROM analytics.order_items i
      JOIN analytics.orders o USING (order_id)
      JOIN analytics.products p USING (product_id)
      WHERE p.category = 'Footwear' AND i.is_returned
        AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    expected: {kind: number, value: 248665.08, tolerance: 0.01, unit: USD}
    notes: Line value after discount. Returns only happen after delivery, so no status filter is needed.
    review: approved

  - id: q031
    batch: 2
    category: cohort
    difficulty: medium
    question: On average, how many orders does a customer place in each segment?
    reference_sql: |
      SELECT c.segment, round(count(o.order_id)::numeric / count(DISTINCT c.customer_id), 2) AS orders_per_customer
      FROM analytics.customers c JOIN analytics.orders o USING (customer_id)
      GROUP BY 1 ORDER BY 2 DESC
    expected: {kind: values, values: {Premium: 12.37, Standard: 11.51, Budget: 7.18}, tolerance_abs: 0.05, all_required: true}
    notes: Customers with at least one order, all order statuses.
    review: approved

  - id: q032
    batch: 2
    category: simple
