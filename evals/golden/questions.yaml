  - id: q027
    batch: 2
    category: time_series
    difficulty: easy
    question: Which single day had the most orders, and how many?
    reference_sql: |
      SELECT order_date::date AS day, count(*) AS orders
      FROM analytics.orders GROUP BY 1 ORDER BY 2 DESC LIMIT 3
    expected: {kind: number, value: 223, tolerance: 0.0}
    must_mention: [[November 24, Nov 24, 24 November, "2025-11-24"]]
    notes: All statuses. Black Friday week 2025.
