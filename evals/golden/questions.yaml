      FROM analytics.orders o JOIN analytics.regions r USING (region_id)
      WHERE status = 'delivered' GROUP BY 1 ORDER BY 2
    expected: {kind: ranking, accept_any_top: {revenue: Central, growth: South}, requires_stated_interpretation: true, tolerance: 0.01}
    notes: Central has the lowest 2025 revenue ($820,992); South has the lowest growth (+19.1%, hit by the March outage). Either is right if the basis is stated.
    review: approved

