  - id: q049
    batch: 3
    category: multi_step
    difficulty: hard
    question: What was our 2025 revenue after subtracting returned items, and how much revenue did returns take away?
    reference_sql: |
      SELECT round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100))
                   FILTER (WHERE NOT oi.is_returned), 2) AS net_revenue,
             round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100))
                   FILTER (WHERE oi.is_returned), 2) AS returned_value
      FROM analytics.order_items oi JOIN analytics.orders o USING (order_id)
      WHERE o.status = 'delivered' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
    cross_check_sql: |
      WITH ret AS (
        SELECT sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100)) AS v
        FROM analytics.order_items oi
        WHERE oi.is_returned AND oi.order_id IN (
          SELECT order_id FROM analytics.orders WHERE status = 'delivered'
          AND extract(year FROM order_date) = 2025))
      SELECT round((SELECT sum(total_amount) FROM analytics.orders WHERE status = 'delivered'
                    AND extract(year FROM order_date) = 2025) - v, 2) AS net_revenue,
             round(v, 2) AS returned_value
      FROM ret
    expected: {kind: values, values: {net_revenue: 7284923.00, returned_value: 605337.41}, tolerance: 0.001, all_required: true}
    notes: Net = delivered line value minus returned lines. The cross-check starts from orders.total_amount, so it may differ by cents (rounding of order totals).
    review: approved

