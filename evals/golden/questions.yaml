  # ------------------------------------------------------------------ batch 3
  # Every SQL-backed question that needs computing has a second, independently written
  # `cross_check_sql` with the same output columns; `python -m evals.golden_check` fails loudly if
  # the two disagree. Facts planted by db/planted.py are cited in `notes` as ground truth.
  - id: q041
    batch: 3
    category: cohort
    difficulty: hard
    question: Of the customers who signed up in Q1 2024, what share placed an order in Q4 2025?
    reference_sql: |
      WITH c AS (SELECT customer_id FROM analytics.customers
                 WHERE signup_date >= '2024-01-01' AND signup_date < '2024-04-01'),
           a AS (SELECT c.customer_id, EXISTS (
                   SELECT 1 FROM analytics.orders o WHERE o.customer_id = c.customer_id
                   AND o.order_date >= '2025-10-01' AND o.order_date < '2026-01-01') AS active
                 FROM c)
      SELECT count(*) AS cohort, count(*) FILTER (WHERE active) AS active,
             round(100.0 * count(*) FILTER (WHERE active) / count(*), 1) AS pct
      FROM a
    cross_check_sql: |
      SELECT count(DISTINCT c.customer_id) AS cohort,
             count(DISTINCT o.customer_id) AS active,
             round(100.0 * count(DISTINCT o.customer_id) / count(DISTINCT c.customer_id), 1) AS pct
      FROM analytics.customers c
      LEFT JOIN analytics.orders o ON o.customer_id = c.customer_id
        AND o.order_date >= '2025-10-01' AND o.order_date < '2026-01-01'
      WHERE c.signup_date BETWEEN '2024-01-01' AND '2024-03-31'
    expected: {kind: number, value: 62.8, unit: percent, tolerance_abs: 0.5}
    notes: Long-run retention of one cohort. Any order counts, cancelled included (reviewer rule from q014).
    review: approved

  - id: q042
    batch: 3
    category: cohort
    difficulty: medium
    question: |
      What share of customers churned overall? Count a customer as churned if they signed up before
      2025-06-01, ordered at least once, and placed no order on or after 2025-09-02.
    reference_sql: |
      WITH last AS (SELECT customer_id, max(order_date) AS last_order FROM analytics.orders GROUP BY 1)
      SELECT count(*) AS customers, round(100.0 * avg((l.last_order < '2025-09-02')::int), 1) AS churn_pct
      FROM analytics.customers c JOIN last l USING (customer_id)
      WHERE c.signup_date < '2025-06-01'
    cross_check_sql: |
      SELECT count(*) AS customers,
             round(100.0 * count(*) FILTER (WHERE NOT EXISTS (
               SELECT 1 FROM analytics.orders o2 WHERE o2.customer_id = c.customer_id
               AND o2.order_date >= '2025-09-02')) / count(*), 1) AS churn_pct
      FROM analytics.customers c
      WHERE c.signup_date < '2025-06-01'
        AND EXISTS (SELECT 1 FROM analytics.orders o WHERE o.customer_id = c.customer_id)
    expected: {kind: number, value: 35.2, unit: percent, tolerance_abs: 0.5}
    notes: Same churn definition as q013 (planted insight 3), asked for the whole base, not per segment.
    review: approved

  - id: q043
    batch: 3
    category: cohort
    difficulty: hard
    question: What is the median number of days between a customer's first and second order?
    reference_sql: |
      WITH r AS (SELECT customer_id, order_date,
                        row_number() OVER (PARTITION BY customer_id ORDER BY order_date, order_id) AS rn
                 FROM analytics.orders)
      SELECT round((percentile_cont(0.5) WITHIN GROUP (
               ORDER BY extract(epoch FROM b.order_date - a.order_date) / 86400))::numeric, 1) AS median_days
      FROM r a JOIN r b ON a.customer_id = b.customer_id AND a.rn = 1 AND b.rn = 2
    cross_check_sql: |
      WITH g AS (SELECT extract(epoch FROM lead(order_date) OVER w - order_date) / 86400 AS gap,
                        row_number() OVER w AS rn
                 FROM analytics.orders
                 WINDOW w AS (PARTITION BY customer_id ORDER BY order_date, order_id)),
           s AS (SELECT gap, row_number() OVER (ORDER BY gap) AS i, count(*) OVER () AS n
                 FROM g WHERE rn = 1 AND gap IS NOT NULL)
      SELECT round(avg(gap)::numeric, 1) AS median_days FROM s
      WHERE i IN ((n + 1) / 2, (n + 2) / 2)
    expected: {kind: number, value: 17.3, tolerance_abs: 0.5}
    notes: |
      Median of fractional days (timestamps) is 17.3; whole calendar days give 17, and both pass. The
      mean (26.7) is a different answer: a few long gaps pull it up. The cross-check finds the
      middle row(s) by hand instead of percentile_cont.
    review: changed - reviewer asked for the median instead of the mean

  - id: q044
    batch: 3
    category: joins
    difficulty: medium
    question: Which product category brought in the most revenue in 2025, and what share of total 2025 revenue was that?
    reference_sql: |
      WITH cat AS (
        SELECT p.category, sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100)) AS rev
        FROM analytics.order_items oi
        JOIN analytics.orders o USING (order_id) JOIN analytics.products p USING (product_id)
        WHERE o.status = 'delivered' AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
        GROUP BY 1)
      SELECT category, round(rev, 2) AS revenue, round(100 * rev / sum(rev) OVER (), 1) AS share_pct
      FROM cat ORDER BY rev DESC LIMIT 1
    cross_check_sql: |
      SELECT p.category,
             round(sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100)), 2) AS revenue,
             round(100 * sum(oi.quantity * oi.unit_price * (1 - oi.discount_pct / 100))
                   / (SELECT sum(total_amount) FROM analytics.orders WHERE status = 'delivered'
                      AND order_date >= '2025-01-01' AND order_date < '2026-01-01'), 1) AS share_pct
      FROM analytics.order_items oi
      JOIN analytics.orders o ON o.order_id = oi.order_id
      JOIN analytics.products p ON p.product_id = oi.product_id
      WHERE o.status = 'delivered' AND extract(year FROM o.order_date) = 2025
      GROUP BY 1 ORDER BY 2 DESC LIMIT 1
    expected: {kind: values, values: {Electronics revenue: 4249628.23, share_pct: 53.9}, tolerance: 0.01, all_required: true}
    must_mention: [[Electronics]]
    notes: Category revenue needs line items; line totals match orders.total_amount (checked, max difference 0.02 on one order).
    review: approved

