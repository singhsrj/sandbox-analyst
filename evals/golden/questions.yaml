    expected: {kind: number, value: 3.89, unit: percent, tolerance_abs: 0.05}
    notes: 1,086 of 27,901.
    review: approved

  - id: q034
    batch: 2
    category: ambiguous
    difficulty: medium
    question: Which region is performing worst?
    reference_sql: |
      SELECT r.region_name,
             sum(total_amount) FILTER (WHERE order_date >= '2025-01-01' AND order_date < '2026-01-01') AS revenue_2025,
