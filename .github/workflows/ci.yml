name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan full history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  api:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests (live tests skip without credentials)
        run: uv run pytest -q
      - name: Frontend fixture is in sync with what the backend emits
        run: |
          uv run python scripts/dump_chunks.py
          git diff --exit-code web/test-fixtures/chunks.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (locked)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests (includes the protocol contract test against the real `ai` package)
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      - name: Production dependencies have no known vulnerabilities
        run: npm audit --omit=dev

  # eval-smoke: added in M6 (small golden subset, cheap model, strict budget)

  image:
    # The production image must build from the lock file (catches Dockerfile / dependency drift).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f api/Dockerfile -t sandbox-analyst-api:ci .
      - name: The image starts and has no secrets or tests in it
        run: |
          docker run --rm --entrypoint sh sandbox-analyst-api:ci -c \
            'test "$(id -u)" != 0 && ! find / -name ".env" -not -path "/proc/*" 2>/dev/null | grep -q . && test ! -d /app/api/tests && python -c "import app.main"'
